kind = "mobile"
previewPath = "/"
title = "Spendwise"
description = "A mobile-first personal finance app for tracking balances, income, expenses, budgets, savings goals, reports, and spending insights with a calm, polished banking experience."
version = "1.0.0"
id = "artifacts/spendwise-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19471

[services.development]
run = "pnpm --filter @workspace/spendwise-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spendwise-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/spendwise-mobile", "run", "serve" ]

[services.env]
PORT = "19471"
BASE_PATH = "/"
